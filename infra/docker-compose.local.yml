# Muallimi Local Development Infrastructure
# Phase 0: Foundation and Local Parity
#
# This provides local alternatives for all managed cloud dependencies.
# No Azure or Cloudflare credentials are required.
#
# Usage: docker compose -f infra/docker-compose.local.yml up -d
#
# Production Equivalent Mapping:
#   PostgreSQL + pgvector  -> Azure Database for PostgreSQL Flexible Server
#   MinIO                  -> Azure Blob Storage
#   RabbitMQ               -> Azure Service Bus
#   Redis                  -> Azure Cache for Redis
#   Seq                    -> Azure Application Insights + Log Analytics

services:
  # ─── Database + Vector Search ───────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: muallimi-postgres
    environment:
      POSTGRES_USER: muallimi
      POSTGRES_PASSWORD: muallimi_local
      POSTGRES_DB: muallimi_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muallimi -d muallimi_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Blob Storage (Azure Blob equivalent) ───────────────────────────
  minio:
    image: minio/minio:latest
    container_name: muallimi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: muallimi
      MINIO_ROOT_PASSWORD: muallimi_local
    ports:
      - "9000:9000"   # S3/Blob API
      - "9001:9001"   # Console UI
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Message Queue (Azure Service Bus equivalent) ───────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: muallimi-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: muallimi
      RABBITMQ_DEFAULT_PASS: muallimi_local
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 5

  # ─── Cache (Azure Cache for Redis equivalent) ───────────────────────
  redis:
    image: redis:7-alpine
    container_name: muallimi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Phase 2: Local LLM Lightweight Tier ────────────────────────────
  # Local LLM container providing the lightweight (fast, cheap) tier behind
  # the ILlmAdapter (llm_lightweight binding). No managed cloud credentials.
  ollama-lightweight:
    image: ollama/ollama:latest
    container_name: muallimi-ollama-lightweight
    ports:
      - "11434:11434"
    volumes:
      - ollama-lightweight-data:/root/.ollama
    environment:
      OLLAMA_MODELS: /root/.ollama/models
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Phase 2: Local LLM Stronger Tier ───────────────────────────────
  # Local LLM container providing the stronger (higher-quality) tier behind
  # the ILlmAdapter (llm_stronger binding). No managed cloud credentials.
  ollama-stronger:
    image: ollama/ollama:latest
    container_name: muallimi-ollama-stronger
    ports:
      - "11435:11434"
    volumes:
      - ollama-stronger-data:/root/.ollama
    environment:
      OLLAMA_MODELS: /root/.ollama/models
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Phase 2: Local Speech-to-Text ──────────────────────────────────
  # Whisper-compatible local STT service behind ISttAdapter.
  stt:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: muallimi-stt
    ports:
      - "9006:9000"
    environment:
      ASR_MODEL: base
      ASR_ENGINE: openai_whisper
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:9000/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Phase 2: Local Text-to-Speech (AI tutor voice profile) ─────────
  # Local TTS service behind ITtsAdapter. The AI tutor voice profile
  # identifier MUST be distinct from every Phase 1 teacher voice profile.
  tts:
    image: synesthesiam/mozillatts:latest
    container_name: muallimi-tts
    ports:
      - "5002:5002"
    environment:
      TTS_VOICE_PROFILE_ID: ai-tutor-voice-v1
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:5002/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Observability (Application Insights equivalent) ────────────────
  seq:
    image: datalust/seq:latest
    container_name: muallimi-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "muallimi_local"
    ports:
      - "5341:5341"   # Ingestion
      - "8081:80"     # UI
    volumes:
      - seq-data:/data

volumes:
  pgdata:
  minio-data:
  rabbitmq-data:
  redis-data:
  seq-data:
  ollama-lightweight-data:
  ollama-stronger-data:

# ─── Phase 2: Local bucket / topics / cache namespace reservations ────
# Bucket `muallimi-ai-tutor-local` (MinIO) — red-team scenario sets and
#   evaluation artefacts. Provisioned by infra/Phase2/Bootstrap.sh.
# Queue/broker topics (RabbitMQ) —
#   `ai.tutor.request.recorded` (ai-service -> main-backend persistence),
#   `ai.tutor.redteam.run.completed` (ai-service -> main-backend persistence).
# Cache namespace (Redis) — `ai-tutor:*` (prompt registry hot path,
#   routing config cache, guardrail rate limiting).
