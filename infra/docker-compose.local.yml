# Muaallimi Local Development Infrastructure — unified stack.
#
# One compose file. Bring it up with:
#   docker compose -f infra/docker-compose.local.yml up -d
#
# Contains every local-parity service the platform needs across all phases
# (0-4). LLM completions + embeddings are served by managed APIs (Claude +
# OpenAI) from the ai-service process — no local LLM container.
#
# Production equivalents:
#   PostgreSQL + pgvector  -> Azure Database for PostgreSQL Flexible Server
#   MinIO                  -> Azure Blob Storage
#   RabbitMQ               -> Azure Service Bus
#   Redis                  -> Azure Cache for Redis
#   Seq                    -> Azure Application Insights + Log Analytics
#   Notification stubs     -> provider behind NotificationChannelAdapter

services:
  # ─── Database + vector search ───────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: muallimi-postgres
    environment:
      POSTGRES_USER: muallimi
      POSTGRES_PASSWORD: muallimi_local
      POSTGRES_DB: muallimi_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muallimi -d muallimi_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Blob storage (Azure Blob equivalent) ───────────────────────────
  minio:
    image: minio/minio:latest
    container_name: muallimi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: muallimi
      MINIO_ROOT_PASSWORD: muallimi_local
    ports:
      - "9000:9000"   # S3/Blob API
      - "9001:9001"   # Console UI
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Message queue (Azure Service Bus equivalent) ───────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: muallimi-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: muallimi
      RABBITMQ_DEFAULT_PASS: muallimi_local
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 5

  # ─── Cache (Azure Cache for Redis equivalent) ───────────────────────
  redis:
    image: redis:7-alpine
    container_name: muallimi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Speech-to-text (Whisper) ───────────────────────────────────────
  stt:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: muallimi-stt
    ports:
      - "9006:9000"
    environment:
      ASR_MODEL: base
      ASR_ENGINE: openai_whisper
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:9000/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Text-to-speech (AI tutor voice profile) ────────────────────────
  # The AI tutor voice profile identifier MUST be distinct from every
  # Phase 1 teacher voice profile (enforced by LocalVoiceProfileAdapter).
  tts:
    image: synesthesiam/mozillatts:latest
    container_name: muallimi-tts
    ports:
      - "5002:5002"
    environment:
      TTS_VOICE_PROFILE_ID: ai-tutor-voice-v1
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:5002/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Observability (Application Insights equivalent) ────────────────
  seq:
    image: datalust/seq:latest
    container_name: muallimi-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "muallimi_local"
    ports:
      - "5341:5341"   # Ingestion
      - "8081:80"     # UI
    volumes:
      - seq-data:/data

  # ─── One-shot bootstrap: MinIO buckets ──────────────────────────────
  # Creates every bucket the platform writes to, across every phase:
  #   muallimi-ai-tutor-local                  (Phase 2 — red-team scenarios)
  #   muallimi-homework-images-local           (Phase 3 — homework uploads)
  #   muallimi-voice-captures-local            (Phase 3 — voice captures)
  #   muallimi-weekly-reports-local            (Phase 4 — weekly report artefacts)
  #   muallimi-operator-audit-exports-local    (Phase 4 — audit exports)
  # Idempotent — safe to re-run.
  minio-bootstrap:
    image: minio/mc:latest
    container_name: muallimi-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 muallimi muallimi_local &&
      mc mb --ignore-existing local/muallimi-ai-tutor-local &&
      mc mb --ignore-existing local/muallimi-homework-images-local &&
      mc mb --ignore-existing local/muallimi-voice-captures-local &&
      mc mb --ignore-existing local/muallimi-weekly-reports-local &&
      mc mb --ignore-existing local/muallimi-operator-audit-exports-local &&
      mc version enable local/muallimi-homework-images-local &&
      mc version enable local/muallimi-voice-captures-local &&
      mc version enable local/muallimi-weekly-reports-local &&
      mc version enable local/muallimi-operator-audit-exports-local &&
      echo 'All MinIO buckets ready'
      "
    restart: "no"

  # ─── One-shot bootstrap: RabbitMQ exchanges + queues ────────────────
  # Declares the topic-exchange topology for every phase:
  #   Phase 2:
  #     ai.tutor.request.recorded              (exchange, topic)
  #     ai.tutor.redteam.run.completed         (exchange, topic)
  #   Phase 3:
  #     student.session.events                 (exchange, topic)
  #     student.session.events.phase4          (queue, bound routing_key=#)
  #   Phase 4:
  #     phase3.session.events                  (exchange, topic — ingestion feed)
  #     phase3.session.events.phase4           (queue, bound routing_key=#)
  #     phase4.downstream.events               (exchange, topic — phase-5 feed)
  #     phase4.downstream.events.phase5        (queue, bound routing_key=#)
  # Idempotent — safe to re-run.
  rabbitmq-bootstrap:
    image: rabbitmq:3-management
    container_name: muallimi-rabbitmq-bootstrap
    depends_on:
      rabbitmq:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local list exchanges >/dev/null 2>&1; do sleep 2; done &&
      rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local declare exchange name=ai.tutor.request.recorded type=topic durable=true &&
      rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local declare exchange name=ai.tutor.redteam.run.completed type=topic durable=true &&
      rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local declare exchange name=student.session.events type=topic durable=true &&
      rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local declare queue name=student.session.events.phase4 durable=true &&
      rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local declare binding source=student.session.events destination=student.session.events.phase4 routing_key=# &&
      rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local declare exchange name=phase3.session.events type=topic durable=true &&
      rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local declare queue name=phase3.session.events.phase4 durable=true &&
      rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local declare binding source=phase3.session.events destination=phase3.session.events.phase4 routing_key=# &&
      rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local declare exchange name=phase4.downstream.events type=topic durable=true &&
      rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local declare queue name=phase4.downstream.events.phase5 durable=true &&
      rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local declare binding source=phase4.downstream.events destination=phase4.downstream.events.phase5 routing_key=# &&
      echo 'All RabbitMQ topology ready'
      "
    restart: "no"

  # ─── Email dev inbox (Mailpit) ──────────────────────────────────────
  # Catches all SMTP traffic from the backend in dev. Identity transactional
  # emails (verification, password reset, invitation) arrive here.
  # SMTP on port 1025, web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: muallimi-mailpit
    ports:
      - "1025:1025"   # SMTP (backend sends here)
      - "8025:8025"   # Web UI (open in browser to read emails)
    environment:
      MP_MAX_MESSAGES: 500
    restart: unless-stopped

  # ─── Notification stubs (Phase 4 NotificationChannelAdapter) ────────
  # Each stub prints to stdout and writes a delivery receipt to a shared
  # volume so tests can assert on-disk evidence.
  notification-stub-in-app:
    image: python:3.12-slim
    container_name: muallimi-notification-stub-in-app
    volumes:
      - ./notification-stubs/in_app_stub:/app:ro
      - notification-stub-receipts:/receipts
    working_dir: /app
    command: ["python", "server.py"]
    ports:
      - "9401:9401"
    restart: unless-stopped

  notification-stub-email:
    image: python:3.12-slim
    container_name: muallimi-notification-stub-email
    volumes:
      - ./notification-stubs/email_stub:/app:ro
      - notification-stub-receipts:/receipts
    working_dir: /app
    command: ["python", "server.py"]
    ports:
      - "9402:9402"
    restart: unless-stopped

  notification-stub-push:
    image: python:3.12-slim
    container_name: muallimi-notification-stub-push
    volumes:
      - ./notification-stubs/push_stub:/app:ro
      - notification-stub-receipts:/receipts
    working_dir: /app
    command: ["python", "server.py"]
    ports:
      - "9403:9403"
    restart: unless-stopped

volumes:
  pgdata:
  minio-data:
  rabbitmq-data:
  redis-data:
  seq-data:
  notification-stub-receipts:

# ─── Reserved namespaces (documentation) ──────────────────────────────
# MinIO buckets:
#   muallimi-ai-tutor-local                  Phase 2 red-team scenarios
#   muallimi-homework-images-local           Phase 3 homework uploads
#   muallimi-voice-captures-local            Phase 3 voice captures
#   muallimi-weekly-reports-local            Phase 4 weekly reports
#   muallimi-operator-audit-exports-local    Phase 4 audit exports
#
# RabbitMQ topology:
#   ai.tutor.request.recorded                Phase 2 exchange
#   ai.tutor.redteam.run.completed           Phase 2 exchange
#   student.session.events (→ ...phase4)     Phase 3 exchange+queue
#   phase3.session.events (→ ...phase4)      Phase 4 ingestion
#   phase4.downstream.events (→ ...phase5)   Phase 4 emission
#
# Redis namespaces:
#   ai-tutor:*            prompt registry + routing config + guardrail rate limits
#   student:session:*     Phase 3 session scope cache
#   student:plan-gate:*   Phase 3 plan gate policy cache
#   phase4:dashboard:*    Phase 4 parent dashboard query cache
#   phase4:preference:*   Phase 4 parent preference cache
#
# Notification stubs (HTTP):
#   in_app  : http://localhost:9401/dispatch
#   email   : http://localhost:9402/dispatch
#   push    : http://localhost:9403/dispatch
