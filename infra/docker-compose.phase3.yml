# Phase 3 - Student Learning Experience (local parity overlay)
#
# Extends the Phase 0/1/2 base stack with:
#   - MinIO bucket pre-seeding for homework image uploads and voice captures.
#   - A second RabbitMQ virtual host / topics for Phase 4-facing session events.
#
# Run with:
#   docker compose -f infra/docker-compose.local.yml \
#                  -f infra/docker-compose.phase3.yml up -d
#
# Production equivalents (unchanged from Phase 0 parity mapping):
#   MinIO        -> Azure Blob Storage
#   RabbitMQ     -> Azure Service Bus
#   Redis        -> Azure Cache for Redis
#   PostgreSQL   -> Azure Database for PostgreSQL

services:
  # Bucket bootstrap for homework images + voice captures. Reuses the Phase 0
  # MinIO container. Idempotent — safe to re-run.
  phase3-minio-bootstrap:
    image: minio/mc:latest
    container_name: muallimi-phase3-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 muallimi muallimi_local &&
      mc mb --ignore-existing local/muallimi-homework-images-local &&
      mc mb --ignore-existing local/muallimi-voice-captures-local &&
      mc version enable local/muallimi-homework-images-local &&
      mc version enable local/muallimi-voice-captures-local &&
      echo 'Phase 3 buckets ready'
      "
    restart: "no"

  # Session-event topic bootstrap. Declares Phase 4-facing exchanges + queues.
  phase3-rabbitmq-bootstrap:
    image: rabbitmq:3-management
    container_name: muallimi-phase3-rabbitmq-bootstrap
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_USER: muallimi
      RABBITMQ_PASSWORD: muallimi_local
      RABBITMQ_HOST: rabbitmq
    entrypoint: >
      /bin/sh -c "
      until rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local list exchanges >/dev/null 2>&1; do sleep 2; done &&
      rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local declare exchange name=student.session.events type=topic durable=true &&
      rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local declare queue name=student.session.events.phase4 durable=true &&
      rabbitmqadmin -H rabbitmq -u muallimi -p muallimi_local declare binding source=student.session.events destination=student.session.events.phase4 routing_key=# &&
      echo 'Phase 3 session-event topology ready'
      "
    restart: "no"

# Phase 3 reserved namespaces (documentation):
#   MinIO buckets:
#     muallimi-homework-images-local  - homework image uploads (retention via
#       HomeworkHelpSubmission.retention_until)
#     muallimi-voice-captures-local   - voice capture blobs (retention via
#       VoiceCapture.retention_until)
#   RabbitMQ topology:
#     student.session.events (exchange, topic)
#     student.session.events.phase4 (queue, routing_key=#)
#   Redis namespace:
#     student:session:*  - session scope cache
#     student:plan-gate:* - plan gate policy cache
